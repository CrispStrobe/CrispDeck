[package]
name = "crispdeck"
version = "0.2.0"
description = "Cross-platform Mastodon + Bluesky client"
authors = ["Christian Strobele"]
edition = "2021"

[lib]
name = "crispdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client for OAuth
reqwest = { version = "0.12", features = ["json"] }

# Credential encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

# Identity detection (jaro-winkler string similarity)
strsim = "0.11"

# System info
hostname = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
debug = 0

[package]
name = "crispdeck"
version = "1.2.8"
description = "Cross-platform Mastodon + Bluesky client"
authors = ["Christian Strobele"]
license = "AGPL-3.0-only OR LicenseRef-LICENSE-COMMERCIAL"
edition = "2021"

[lib]
name = "crispdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client for OAuth (rustls for Android/iOS cross-compilation — no OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Credential encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

# Identity detection (jaro-winkler string similarity)
strsim = "0.11"

# Logging
log = "0.4"
env_logger = "0.11"

# System info (desktop only — hostname crate doesn't compile on mobile)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
hostname = "0.4"

# ── CrispASR (optional — translation, TTS, STT) ──────────────────────────
# Path dep to sibling CrispASR checkout. Same pattern as crisp-docx and
# CrispSorter. Enable with:
#   cargo build --features crispasr-metal    (macOS)
#   cargo build --features crispasr-vulkan   (Windows / Linux)
#   cargo build --features crispasr-cuda     (NVIDIA)
# CrispASR: optional, loaded via git dep. The default build (no feature
# flags) compiles fine without CrispASR. Enable locally with:
#   cargo build --features crispasr-metal    (macOS, needs sibling checkout)
# CI runs `cargo check` without the feature — stubs compile clean.
# No version pin: the crate lives only in that git repo and its version moves
# independently (0.5 -> 0.8.x broke resolution even with the feature disabled).
[dependencies.crispasr]
git      = "https://github.com/CrispStrobe/CrispASR"
optional = true

[features]
default = ["desktop"]
desktop = ["dep:tauri-plugin-shell", "dep:tauri-plugin-process"]
crispasr        = ["dep:crispasr"]
crispasr-metal  = ["crispasr", "crispasr/metal"]
crispasr-vulkan = ["crispasr", "crispasr/vulkan"]
crispasr-cuda   = ["crispasr", "crispasr/cuda"]

[profile.dev.package."*"]
debug = 0

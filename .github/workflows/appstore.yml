# App Store Connect: read the record, push the listing, submit for review.
#
# Screenshots stay in appstore-screenshots.yml, which captures them with
# Playwright and uploads them; this is everything else.
#
# `status` is read-only and is the one to run first. "Is this submittable"
# had been answered by reading the scripts that push metadata rather than by
# asking Apple what is stored, and those are different questions.
#
# workflow_dispatch only. Submitting a version for App Review is not a
# checklist item — it puts the app in front of Apple under a real developer
# account, and a rejection costs days.

name: App Store

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to do'
        type: choice
        options:
          - status              # read-only: what does Apple hold?
          - listing-dry-run     # show what pushing metadata would change
          - listing             # push name, description, keywords, URLs, contact
          - submit              # age rating, price, attach build, review submission
        default: status
      platform:
        description: 'Platform (status and submit)'
        type: choice
        options: [both, ios, macos]
        default: both

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet cryptography

      # client.py reads ASC_API_KEY_P8_BASE64 or falls back to a file. This
      # repo's secret holds the RAW PEM; write it where client.py looks rather
      # than re-encoding it into an env var, because GitHub masks a secret in
      # logs but would not mask a base64 of it.
      - name: Provide the API key where client.py looks for it
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p .appstoreconnect
          key=".appstoreconnect/AuthKey_${ASC_KEY_ID:-9RMU3C7422}.p8"
          umask 077
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$key"
          fi
          grep -q "BEGIN PRIVATE KEY" "$key" \
            || { echo "::error::APPLE_API_KEY_P8 is neither PEM nor base64 PEM"; exit 1; }

      - name: ${{ inputs.task }}
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          plat=()
          [ "${{ inputs.platform }}" != "both" ] && plat=(--platform "${{ inputs.platform }}")
          case "${{ inputs.task }}" in
            status)          python3 tools/asc/status.py "${plat[@]}" ;;
            listing-dry-run) python3 tools/asc/listing.py --dry-run ;;
            listing)         python3 tools/asc/listing.py ;;
            submit)          python3 tools/asc/submit.py "${plat[@]}" ;;
          esac

      - name: Remove the key
        if: always()
        run: rm -rf .appstoreconnect

# Publish a GitHub Pages mirror of CrispDeck.
#
# The canonical deployment is Vercel, at the root of its own origin. Pages
# serves a project site under /<repo>/, so this build sets BASE_PATH and runs
# scripts/mount-at-base.mjs to move the three static files that hardcode an
# origin or a root path — the OAuth client document, the web manifest, and the
# service worker. Those edits happen in the CI checkout only and are never
# committed: the files in the repository stay correct for Vercel, whose OAuth
# client identity is registered against that origin.
#
# Pages serves static files only, so this build has no /api/* of its own. Those
# calls go to the Vercel deployment instead (PUBLIC_API_ORIGIN below), which
# allowlists this origin for CORS — so web push and feed publishing work here
# too. Two things still cannot: hosting a feed generator, which has to answer
# at its own origin, and Threads sign-in, which additionally needs this
# origin's callback URL registered in the Meta developer app. See README.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished publish: the site would be left mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Work out where this site will live
        id: where
        run: |
          # ${{ github.repository }} is owner/repo. A user or organisation site
          # (<owner>.github.io) is served at the origin root and needs no base
          # path; every other repository becomes a project site under /<repo>/.
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          origin="https://${owner}.github.io"
          if [ "${repo,,}" = "${owner}.github.io" ]; then base=""; else base="/${repo}"; fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "base=$base"     >> "$GITHUB_OUTPUT"
          echo "Publishing to ${origin}${base}/"

      - name: Point the static files at this origin
        run: node scripts/mount-at-base.mjs --origin "${{ steps.where.outputs.origin }}" --base "${{ steps.where.outputs.base }}"

      - run: npx svelte-kit sync
      - run: npx vite build
        env:
          BASE_PATH: ${{ steps.where.outputs.base }}
          # Pages serves static files only, so this build's /api/* calls go to
          # the Vercel deployment instead. api/_lib/cors.ts allowlists this
          # origin so the browser permits them.
          PUBLIC_API_ORIGIN: https://crispdeck.vercel.app

      - name: Add the SPA fallback and stop Jekyll touching the build
        run: |
          # Pages has no rewrite rule, so a deep link is served by 404.html.
          # The app boots from there and the router takes over.
          cp build/index.html build/404.html
          # Without this, Jekyll drops every directory whose name starts with
          # an underscore — which is all of _app, i.e. the entire application.
          touch build/.nojekyll

      - name: Check the build is actually mounted where we think
        run: |
          base='${{ steps.where.outputs.base }}'
          # A wrong base produces a page that loads nothing and reports no
          # error, so fail here rather than publishing a blank site.
          grep -q "\"${base}/_app/immutable/entry/start" build/index.html \
            || { echo "::error::built assets are not under ${base}/ — BASE_PATH did not apply"; exit 1; }
          grep -q "${{ steps.where.outputs.origin }}${base}/oauth/bsky-callback" build/client-metadata.json \
            || { echo "::error::OAuth redirect_uri does not point at this origin"; exit 1; }
          echo "index.html, assets and OAuth client document all agree on ${base}/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Web Package

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx svelte-kit sync && npx vite build
      - name: Package and verify the static web app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -s build/index.html
          mkdir release-assets
          (cd build && zip -qr "../release-assets/CrispDeck_${VERSION}_web.zip" .)
          unzip -t "release-assets/CrispDeck_${VERSION}_web.zip" >/dev/null
          python3 tools/release/manifest.py receipt web release-assets --check archive
      - uses: actions/upload-artifact@v4
        with:
          name: package-web
          path: release-assets/
          if-no-files-found: error

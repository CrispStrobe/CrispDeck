name: macOS DMG (Developer ID, notarized)

# The direct-download half of macOS distribution: a Developer ID-signed,
# notarized, stapled .dmg attached to a GitHub Release.
#
# Why this exists ALONGSIDE macos-appstore.yml, rather than instead of it:
# the two are signed by different identities for different gatekeepers. The App
# Store build is signed "Apple Distribution", sandboxed, wrapped in a .pkg and
# reviewed by Apple. This one is signed "Developer ID Application", notarized by
# an automated service, and runs from anywhere. A build signed for one is not
# valid for the other.
#
# Triggers:
#   * the coordinated release workflow calls this builder
#   * manual "Run workflow" builds without publishing
#
# Notarization uses the SAME App Store Connect API key as everything else, so no
# app-specific password is involved.

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_NAME: CrispDeck

defaults:
  run:
    shell: bash

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal, same reasoning as the App Store build: an arm64-only
          # binary would simply not run on Intel Macs.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Import the Developer ID certificate
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/devid.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          echo "${{ secrets.MACOS_DEVID_P12 }}" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" \
            -P "${{ secrets.MACOS_DEVID_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::Developer ID Application identity not present after import"; exit 1; }

      # Notarization REQUIRES the hardened runtime, and rejects the App Sandbox
      # entitlements this repo carries for the App Store. So this build passes no
      # --entitlements at all and lets tauri apply hardened runtime: a direct
      # download does not need the sandbox, and shipping it here would only
      # restrict the app for no gatekeeper's benefit.
      - name: Build + sign the DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        with:
          args: --bundles dmg --target universal-apple-darwin

      - name: Locate the DMG
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target -path "*/release/bundle/dmg/*.dmg" -maxdepth 7 | head -1)
          [ -n "$DMG" ] || { echo "::error::no .dmg produced"; exit 1; }
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          echo "found $DMG"

      - name: Notarize and staple
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          # Raw PEM, not base64 — see macos-appstore.yml.
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

          # --wait blocks until Apple returns a verdict; without it the job would
          # "succeed" while notarization was still pending or had failed.
          xcrun notarytool submit "$DMG_PATH" \
            --key ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait --timeout 45m

          # Stapling attaches the ticket to the DMG so Gatekeeper accepts it with
          # no network round-trip on the user's machine.
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      # Prove what the user will actually experience, rather than trusting that
      # the previous steps implied it.
      - name: Verify Gatekeeper accepts it
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MNT"
          APP=$(find "$MNT" -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority=Developer ID Application" \
            || { echo "::error::not signed with Developer ID"; exit 1; }
          spctl --assess --type execute --verbose=4 "$APP"
          for arch in arm64 x86_64; do
            lipo -archs "$APP/Contents/MacOS/${{ env.PRODUCT_NAME }}" | grep -qw "$arch" \
              || { echo "::error::$arch slice missing"; exit 1; }
          done
          hdiutil detach "$MNT"
          echo "notarized, stapled, Gatekeeper-accepted, universal"

      - name: Install, replace and launch the notarized app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release/desktop_smoke.py macos "$DMG_PATH" --output "$RUNNER_TEMP/macos-smoke"
          mkdir -p release-assets
          cp "$DMG_PATH" release-assets/
          python3 tools/release/manifest.py receipt macos release-assets --check codesign --check notarization --check gatekeeper --check universal --check install_smoke --checks-file "$RUNNER_TEMP/macos-smoke/checks.json"
      - name: Retain Mac installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: |
            ${{ runner.temp }}/macos-smoke/*.json
            ${{ runner.temp }}/macos-smoke/*.png
            ${{ runner.temp }}/macos-smoke/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: release-assets/
          if-no-files-found: error

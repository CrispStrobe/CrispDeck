# Render benchmarks, run on a CI runner rather than a workstation.
#
# Frame times and long-task durations are only meaningful on an idle machine.
# Measured on a loaded dev box the same work swung between 55ms and 290ms,
# which is enough to "prove" whatever you were hoping for. The runner is not
# fast, but it is consistent, and consistency is what a before/after needs.
#
# Runs on demand and on pushes that touch the rendering path, so a regression
# shows up next to the change that caused it.

name: Perf

on:
  workflow_dispatch:
    inputs:
      columns:
        description: 'Deck columns to render'
        default: '8'
      items:
        description: 'Items per column'
        default: '50'
  push:
    branches: [main]
    paths:
      - 'src/lib/components/**'
      - 'src/routes/deck/**'
      - 'src/routes/feed/**'
      - 'src/lib/api/unified.ts'
      - 'src/lib/api/near-duplicate.ts'
      - 'bench/**'
      - '.github/workflows/perf.yml'

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deck:
    name: Deck render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx svelte-kit sync && npx vite build

      - name: Bundle weight
        run: |
          set -o pipefail
          node bench/bundle-size.mjs build | tee bundle-size.json
          {
            echo "### Bundle weight (gzipped)"
            echo
            node -e '
              const b = require("./bundle-size.json");
              const kb = (n) => (n / 1024).toFixed(1) + " KB";
              console.log("| | gzip |");
              console.log("|---|---|");
              console.log(`| entry (every visitor pays this) | **${kb(b.entryGzip)}** across ${b.entryModules} modules |`);
              console.log(`| all JS | ${kb(b.allJsGzip)} across ${b.jsFiles} files |`);
              console.log(`| CSS | ${kb(b.cssGzip)} |`);
              console.log("");
              console.log("Largest chunks:");
              console.log("");
              for (const c of b.biggestChunks)
                console.log(`- \`${c.file}\` — ${kb(c.gzip)}${c.contains.length ? " — " + c.contains.join(", ") : ""}`);
              if (b.routes && b.routes.length) {
                console.log("");
                console.log("Cost to visit a route, on top of the entry:");
                console.log("");
                console.log("| route | extra gzip |");
                console.log("|---|---|");
                for (const r of b.routes.slice(0, 15)) console.log(`| \`${r.route}\` | ${kb(r.extraGzip)} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Serve the build
        run: |
          npx vite preview --port 4173 &
          # Wait for it rather than sleeping a fixed amount: a cold runner can
          # take several seconds, and a fixed sleep either wastes time or
          # measures a server that is not up yet.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4173/ || { echo "preview never came up"; exit 1; }

      - name: Measure
        id: bench
        env:
          BENCH_COLUMNS: ${{ github.event.inputs.columns || '8' }}
          BENCH_ITEMS: ${{ github.event.inputs.items || '50' }}
        run: |
          # pipefail, or tee's exit status hides a failed benchmark and the job
          # reports success while having measured nothing.
          set -o pipefail
          node bench/deck-render.mjs | tee bench-result.json

      - name: Check the measurement actually measured something
        run: |
          # Not a wall-clock threshold -- those are machine-dependent and this
          # runner is shared. This only asserts the benchmark did its job: a
          # step that silently skips is indistinguishable from a fast deck,
          # which is exactly how a broken scroll metric survived two runs.
          node -e '
            const r = require("./bench-result.json");
            const fail = [];
            if (r.pageErrors > 0) fail.push(`${r.pageErrors} page errors`);
            if (!r.scroll || r.scroll.skipped)
              fail.push(`scroll not measured: ${r.scroll ? r.scroll.skipped : "null"}`);
            // Not an equality check: DeckColumn caps rendering per column, so
            // a fixture with more items than the cap legitimately renders
            // fewer. The ceiling still catches double-counting -- a row
            // carrying the key on two nested elements once reported 480.
            const ceiling = r.columns * r.itemsPerColumn;
            if (!(r.postsRendered > 0))
              fail.push("no posts rendered");
            else if (r.postsRendered > ceiling)
              fail.push(`rendered ${r.postsRendered} posts, more than the ${ceiling} supplied`);
            else if (r.postsRendered % r.columns !== 0)
              fail.push(`${r.postsRendered} posts across ${r.columns} columns is uneven`);
            if (fail.length) { console.error("benchmark invalid:\n  " + fail.join("\n  ")); process.exit(1); }
            console.log("measurement complete: " + r.postsRendered + " posts, " + r.scroll.frames + " frames sampled");
          '

      - name: Report
        if: always()
        run: |
          {
            echo "### Deck render benchmark"
            echo
            echo '```json'
            cat bench-result.json 2>/dev/null || echo '{}'
            echo '```'
            echo
            echo "Runner: \`$(nproc)\` cores, $(free -m | awk '/Mem:/ {print $2}') MB RAM."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deck-bench
          path: |
            bench-result.json
            bundle-size.json
          retention-days: 7

name: Android Layout Validation

on:
  pull_request:
    paths:
      - '.github/workflows/android-layout.yml'
      - 'src-tauri/android/**'
      - 'src-tauri/gen/android/app/src/main/AndroidManifest.xml'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.*'
      - 'src/app.css'
      - 'src/app.html'
      - 'src/routes/+layout.svelte'
      - 'src/routes/feed/**'
      - 'src/lib/components/**'
      - 'package*.json'
      - 'scripts/merge-android-manifest.py'
      - 'scripts/test_android_layout.py'
      - 'tools/validation/android_layout_smoke.py'
      - 'tools/validation/mobile_smoke.py'
      - 'tools/validation/requirements-android.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  android-layout:
    name: Android debug build and native layout
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: Set Android NDK path
        env:
          ANDROID_LAYOUT_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: echo "NDK_HOME=$ANDROID_LAYOUT_NDK" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Initialize the real Tauri Android project
        run: |
          set -euo pipefail
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          cp "$MANIFEST" "$RUNNER_TEMP/crispdeck-layout-manifest.xml"
          # Generated Java/Gradle files belong only to this disposable runner.
          rm -rf src-tauri/gen/android
          npx tauri icon static/icon-1024.png
          npx tauri android init --ci --skip-targets-install
          python3 scripts/merge-android-manifest.py "$RUNNER_TEMP/crispdeck-layout-manifest.xml" "$MANIFEST"
          ACTIVITY=src-tauri/gen/android/app/src/main/java/com/christianstrobele/crispdeck/MainActivity.kt
          test -f "$ACTIVITY"
          cp src-tauri/android/MainActivity.kt "$ACTIVITY"
          # Resolve buildSrc's unchanged Kotlin compiler from Maven Central;
          # the plugin portal's GitHub release redirect returned HTTP 504.
          test ! -e src-tauri/gen/android/buildSrc/settings.gradle
          BUILDSRC_SETTINGS=src-tauri/gen/android/buildSrc/settings.gradle.kts
          test ! -e "$BUILDSRC_SETTINGS"
          cat > "$BUILDSRC_SETTINGS" <<'GRADLE'
          pluginManagement {
              repositories {
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          GRADLE
      - name: Download and verify the generated Gradle distribution
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from zipfile import ZipFile
          wrapper = Path('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties')
          properties = wrapper.read_text()
          distribution = re.search(
              r'^distributionUrl=https://(?:services|downloads)\.gradle\.org/distributions/(gradle-(\d+(?:\.\d+){1,2})-bin\.zip)$',
              properties.replace(r'\:', ':'), re.MULTILINE)
          if distribution is None:
              raise SystemExit('Expected the generated official Gradle binary distribution')
          filename, version = distribution.groups()
          curl = ['curl', '--fail', '--location', '--silent', '--show-error',
                  '--retry', '3', '--retry-delay', '2', '--retry-max-time', '120',
                  '--connect-timeout', '15', '--max-time', '60']
          release_api = 'https://api.github.com/repos/gradle/gradle-distributions/releases'
          release = json.loads(subprocess.check_output([*curl, f'{release_api}/tags/v{version}']))
          assets = [asset for asset in release['assets'] if asset['name'] == filename]
          if len(assets) != 1:
              raise SystemExit('Expected one matching official Gradle release asset')
          checksum = subprocess.check_output(
              [*curl, f'https://downloads.gradle.org/distributions/{filename}.sha256'], text=True).strip()
          if re.fullmatch(r'[a-f0-9]{64}', checksum) is None:
              raise SystemExit('Invalid official Gradle distribution checksum')
          existing_checksum = re.search(r'^distributionSha256Sum=(.+)$', properties, re.MULTILINE)
          if existing_checksum and existing_checksum[1].strip() != checksum:
              raise SystemExit('Generated Gradle checksum differs from the official release')
          archive = Path(os.environ['RUNNER_TEMP']) / filename
          # The browser download endpoint returned repeated HTTP 504s. The
          # official asset API serves the same bytes, verified against Gradle.
          asset_url = f'{release_api}/assets/{int(assets[0]["id"])}'
          subprocess.run([*curl, '--header', 'Accept: application/octet-stream',
                          '--output', str(archive), asset_url], check=True)
          with archive.open('rb') as file:
              actual_checksum = hashlib.file_digest(file, 'sha256').hexdigest()
          if actual_checksum != checksum:
              raise SystemExit('Downloaded Gradle distribution checksum mismatch')
          # Gradle reuses local Maven artifacts only after verifying their
          # remote checksums. Its verified ZIP already contains the identical
          # Kotlin compiler that the release-download endpoint cannot serve.
          with ZipFile(archive) as contents:
              compilers = [name for name in contents.namelist() if re.fullmatch(
                  rf'gradle-{re.escape(version)}/lib/kotlin-compiler-embeddable-\d+(?:\.\d+){{1,2}}\.jar', name)]
              if len(compilers) != 1:
                  raise SystemExit('Expected one bundled Kotlin compiler')
              compiler = contents.read(compilers[0])
          compiler_name = Path(compilers[0]).name
          compiler_version = compiler_name.removeprefix('kotlin-compiler-embeddable-').removesuffix('.jar')
          compiler_path = f'org/jetbrains/kotlin/kotlin-compiler-embeddable/{compiler_version}/{compiler_name}'
          compiler_checksum = subprocess.check_output(
              [*curl, f'https://repo.maven.apache.org/maven2/{compiler_path}.sha1'], text=True).strip()
          if (re.fullmatch(r'[a-f0-9]{40}', compiler_checksum) is None or
                  hashlib.sha1(compiler).hexdigest() != compiler_checksum):
              raise SystemExit('Bundled Kotlin compiler differs from the Maven release')
          cached_compiler = Path.home() / '.m2/repository' / compiler_path
          cached_compiler.parent.mkdir(parents=True, exist_ok=True)
          cached_compiler.write_bytes(compiler)
          print(f'Warmed verified {compiler_name} for Gradle checksum-based reuse')
          properties = re.sub(r'^distributionUrl=.+$', 'distributionUrl=' + archive.as_uri(),
                              properties, flags=re.MULTILINE)
          if existing_checksum is None:
              properties = properties.rstrip() + f'\ndistributionSha256Sum={checksum}\n'
          wrapper.write_text(properties)
          print(f'Verified official {filename} ({checksum})')
          PY
      - name: Compile the Android app without release credentials
        run: npx tauri android build --debug --apk --target x86_64 --ci
      - name: Retain the debug APK and its source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          root = Path('src-tauri/gen/android')
          packages = list(root.glob('**/build/outputs/apk/**/debug/*.apk'))
          if len(packages) != 1:
              raise SystemExit(f'Expected one debug APK, found {packages}')
          output = Path('android-layout')
          output.mkdir(exist_ok=True)
          shutil.copyfile(packages[0], output / 'CrispDeck-android-layout-debug.apk')
          (output / 'source.json').write_text(json.dumps({
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'variant': 'debug', 'target': 'x86_64-linux-android',
              'release_signed': False, 'published': False,
          }, indent=2) + '\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native UI automation
        run: python3 -m pip install --disable-pip-version-check -r tools/validation/requirements-android.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify system bars, rotation, and keyboard in the debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/validation/android_layout_smoke.py --apk android-layout/CrispDeck-android-layout-debug.apk --output android-layout/evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-layout-debug
          path: android-layout/
          if-no-files-found: ignore
          retention-days: 7

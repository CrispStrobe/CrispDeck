name: Google Play Internal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release to verify/upload
        type: string
        default: v1.3.0
      action:
        description: Offline preflight, access check, or internal-track release
        type: choice
        options: [preflight, check-access, publish-internal]
        default: preflight

permissions:
  contents: read

concurrency:
  group: crispdeck-google-play-internal
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  internal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: python3 -m pip install --quiet cryptography
      - name: Download only the published Android release and its checksums
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vVERSION tag'; exit 1; }
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          mkdir release-assets
          gh release download "$TAG" --dir release-assets --pattern "CrispDeck_${VERSION}_android_release.apk" --pattern "CrispDeck_${VERSION}_android_release.aab" --pattern "CrispDeck_${VERSION}_android-cert.sha256" --pattern SHA256SUMS
      - name: Verify local assets and optionally access/publish internal testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          VERSION: ${{ steps.release.outputs.version }}
          ACTION: ${{ inputs.action }}
        run: |
          python3 tools/play/publish.py "$ACTION" --assets release-assets --version "$VERSION" | tee play-result.log
          {
            echo "### Google Play: $ACTION"
            tail -8 play-result.log
            echo 'Offline preflight does not contact Google. Access checks discard a temporary edit. Publication is limited to the internal track; Google processing/review remain separate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-preflight-result
          path: play-result.log
          if-no-files-found: warn

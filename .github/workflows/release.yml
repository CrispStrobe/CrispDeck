name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0). If omitted, uses the current HEAD.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'
            artifact_suffix: macos-arm64
          - platform: macos-13
            rust_target: x86_64-apple-darwin
            tauri_args: '--target x86_64-apple-darwin'
            artifact_suffix: macos-x64
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ''
            artifact_suffix: windows-x64
          - platform: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: '--bundles deb'
            artifact_suffix: linux-x64

    runs-on: ${{ matrix.platform }}

    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target }}

      - run: npm ci

      - name: Run tests
        if: runner.os == 'Linux'
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || 'v__VERSION__' }}
          releaseName: 'CrispDeck ${{ inputs.tag || ''v__VERSION__'' }}'
          releaseBody: |
            ## What's New

            - **GIF picker** — search/browse Tenor GIFs in compose
            - **Inline translation** — translate any post (MyMemory API, cached)
            - **Internationalization** — English + German UI, language selector
            - **Share as image** — render any post as branded PNG
            - **Custom PDS** — federated Bluesky PDS instances work automatically
            - **Alt text enforcement** — off / warn / require modes
            - **256 tests** (up from 118)

            See the [changelog](https://github.com/CrispStrobe/CrispDeck/commits/main) for details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}

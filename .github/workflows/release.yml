name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0). If omitted, uses the current HEAD.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built, signed and notarized by macos-dmg.yml.
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ''
            artifact_suffix: windows-x64
          - platform: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: '--bundles deb'
            artifact_suffix: linux-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target }}

      - run: npm ci

      - name: Run tests
        if: runner.os == 'Linux'
        run: npm test -- --maxWorkers=2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || 'v__VERSION__' }}
          releaseName: 'CrispDeck ${{ inputs.tag || ''v__VERSION__'' }}'
          releaseBody: |
            See the [CHANGELOG](https://github.com/CrispStrobe/CrispDeck/blob/main/CHANGELOG.md) for what's new in this release.
          # Assemble all platforms before publishing the release.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

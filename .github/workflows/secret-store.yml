# Does the OS secret store actually work?
#
# The unit tests put a fake store behind the trait, which checks the dispatch,
# the fallback and the migration — everything except whether the platform
# accepts what we write. That part cannot be faked, and it is the part that
# locks someone out of their accounts when it is wrong.
#
# Each runner gets a store it owns: a temporary keychain on macOS, a
# gnome-keyring session on Linux, and on Windows the runner's own Credential
# Manager, which needs no preparation. Nothing here touches a developer's real
# keychain — that is also why the tests are off unless CRISPDECK_REAL_KEYCHAIN
# is set.
#
# Separate from the required checks: this depends on a headless keyring daemon
# behaving, and a required check should report on the change rather than on
# the runner image.

name: Secret store

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/auth/**'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/secret-store.yml'
  pull_request:
    paths:
      - 'src-tauri/src/auth/**'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/secret-store.yml'
  workflow_dispatch:

jobs:
  real-store:
    name: Real OS store (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: macos-14
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            gnome-keyring \
            dbus-x11

      # A login keychain on a CI runner is locked and prompting for it would
      # hang the job. Make one we own, unlock it, and put it in the search
      # list so the keyring crate finds it.
      - name: Prepare a keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci-not-a-real-password crispdeck-ci.keychain
          security unlock-keychain -p ci-not-a-real-password crispdeck-ci.keychain
          security list-keychains -d user -s crispdeck-ci.keychain login.keychain
          security default-keychain -s crispdeck-ci.keychain
          # No timeout, or it relocks partway through the run.
          security set-keychain-settings crispdeck-ci.keychain

      # No session bus on a headless runner, so start one and unlock a
      # keyring inside it. The whole cargo invocation runs in that session.
      - name: Run against the real store (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        env:
          CRISPDECK_REAL_KEYCHAIN: '1'
        run: |
          dbus-run-session -- bash -c '
            echo ci-not-a-real-password | gnome-keyring-daemon --unlock --components=secrets
            cargo test --lib auth::secret_store -- --nocapture --test-threads=1
          '

      # macOS runs twice: once in the keychain the app makes for itself, once
      # in the login keychain, because both are offered to the user and a
      # choice nobody tests is a choice that breaks.
      #
      # CRISPDECK_KEYCHAIN_PATH keeps the dedicated one in the runner's temp
      # directory. A test that writes to ~/Library/Keychains leaves something
      # behind, and on a developer machine that would be someone's real one.
      - name: Run against the dedicated keychain (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        env:
          CRISPDECK_REAL_KEYCHAIN: '1'
          CRISPDECK_MACOS_KEYCHAIN: dedicated
          CRISPDECK_KEYCHAIN_PATH: ${{ runner.temp }}/crispdeck-test.keychain-db
        run: cargo test --lib auth::secret_store -- --nocapture --test-threads=1

      - name: Run against the login keychain (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        env:
          CRISPDECK_REAL_KEYCHAIN: '1'
          CRISPDECK_MACOS_KEYCHAIN: login
        run: cargo test --lib auth::secret_store -- --nocapture --test-threads=1

      - name: Run against the real store (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        env:
          CRISPDECK_REAL_KEYCHAIN: '1'
        run: cargo test --lib auth::secret_store -- --nocapture --test-threads=1

      - name: Clean up the keychain (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          security default-keychain -s login.keychain || true
          security delete-keychain crispdeck-ci.keychain || true
          rm -f "${{ runner.temp }}/crispdeck-test.keychain-db" || true

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Real OS store — ${{ matrix.platform }}"
            echo
            echo "The unit tests use a fake store. This job runs the same code"
            echo "against the platform's own: Secret Service, Keychain, or"
            echo "Credential Manager. A failure here means the store rejected"
            echo "something we wrote, which no fake can tell us."
          } >> "$GITHUB_STEP_SUMMARY"

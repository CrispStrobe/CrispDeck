name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_validation:
        description: Keep full runtime validation mandatory for coordinated releases
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  scope:
    name: Release guards and change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Release and security guards
        run: |
          node --test tools/security/test_legacy_storage.mjs
          python3 -m unittest discover -s tools/asc -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 -m unittest discover -s tools/play -p 'test_*.py'
      - name: Select runtime validation
        id: scope
        env:
          FORCE_FULL: ${{ (github.event_name == 'workflow_dispatch' || inputs.full_validation) && 'true' || 'false' }}
        run: python3 scripts/ci_scope.py

  required:
    name: Required CI
    if: always()
    needs: [scope, frontend, rust-check, node26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust-check.result }}
          NODE26_RESULT: ${{ needs.node26.result }}
        run: |
          [ "$SCOPE_RESULT" = success ] || { echo 'Release/scope guards failed'; exit 1; }
          case "$FULL" in
            true) EXPECTED=success ;;
            false) EXPECTED=skipped ;;
            *) echo 'Missing or invalid validation scope'; exit 1 ;;
          esac
          for result in "$FRONTEND_RESULT" "$RUST_RESULT" "$NODE26_RESULT"; do
            if [ "$result" != "$EXPECTED" ]; then
              echo "Required CI dependency did not pass: $result"
              exit 1
            fi
          done

  node26:
    name: Node 26 tests
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.4.0'
          cache: npm
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm test -- --maxWorkers=2

  frontend:
    name: Frontend and browser tests
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test -- --maxWorkers=2
      - run: npx svelte-kit sync
      - name: Build production bundle
        env:
          BENCH_CHUNK_MAP: '1'
        run: npx vite build
      - name: Enforce production bundle budget
        run: |
          node bench/bundle-size.mjs build > bundle-size.json
          node bench/check-budget.mjs bundle-size.json bench/bundle-budget.json
      - run: bash scripts/ci-apt.sh
      - run: npx playwright install --with-deps chromium webkit
        id: browser-install
      - run: npx playwright test --reporter=list
      - name: Verify Android touch post layouts
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: node e2e/post-mobile.live.mjs
      - name: Retain mobile layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-screenshots
          path: |
            playwright-results/**/android-feed-*.png
            playwright-results/post-mobile-*.png
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-results/
            playwright-report/
            bundle-size.json
            chunk-map.client.json
          retention-days: 7
          if-no-files-found: ignore

  rust-check:
    name: Rust check (${{ matrix.platform }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: macos-15
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check mobile dependency boundaries with default features
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import subprocess
          for target in ('aarch64-apple-ios', 'aarch64-linux-android'):
              tree = subprocess.check_output([
                  'cargo', 'tree', '--manifest-path', 'src-tauri/Cargo.toml',
                  '--target', target, '--depth', '1', '--edges', 'normal', '--locked',
              ], text=True)
              if 'tauri-plugin-single-instance' in tree:
                  raise SystemExit(f'{target}: desktop-only single-instance dependency leaked into mobile')
              print(f'{target}: desktop-only dependency excluded with default features enabled')
          PY

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      # `cargo check` type-checks and stops. It never builds the test
      # binaries, so the unit tests in src-tauri had never run in CI — they
      # could have been broken for months without anyone finding out. The
      # Rust side holds credential encryption, the Mastodon OAuth exchange
      # and the whole local database, so it is the last place that should be
      # unverified.
      - name: Parse Windows release helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('tools/release/sign_windows.ps1', 'tools/release/windows_bundle_hook.ps1', 'tools/release/windows_smoke.ps1')) {
            $errors = $null; $tokens = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --locked

      # Kept separately: `cargo test` builds the lib and its tests, but not
      # the binary target, and a break there would still ship.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked


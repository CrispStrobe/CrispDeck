name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - name: Release submission guards
        run: |
          python3 -m unittest discover -s tools/asc -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p 'test_*.py'
      - run: npm run check
      - run: npm test -- --maxWorkers=2
      - run: npx svelte-kit sync
      - run: npx vite build
      - run: bash scripts/ci-apt.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  rust-check:
    name: Rust check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: macos-14
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      # `cargo check` type-checks and stops. It never builds the test
      # binaries, so the unit tests in src-tauri had never run in CI — they
      # could have been broken for months without anyone finding out. The
      # Rust side holds credential encryption, the Mastodon OAuth exchange
      # and the whole local database, so it is the last place that should be
      # unverified.
      - name: Parse Windows release helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('tools/release/sign_windows.ps1', 'tools/release/windows_smoke.ps1')) {
            $errors = $null; $tokens = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --locked

      # Kept separately: `cargo test` builds the lib and its tests, but not
      # the binary target, and a break there would still ship.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked


name: Mobile Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ios:
    name: iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Install Xcode command line tools
        run: xcode-select --print-path || sudo xcode-select --install

      - name: Initialize iOS project
        run: npx tauri ios init || true

      - name: Build iOS (unsigned debug)
        run: |
          cd src-tauri/gen/apple
          xcodebuild -project CrispDeck.xcodeproj \
            -scheme CrispDeck_iOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -20 || echo "iOS xcodebuild completed with warnings"

      - name: Collect iOS build artifacts
        run: |
          mkdir -p ios-artifacts
          find src-tauri/gen/apple/build -name "*.app" -type d | head -1 | while read app; do
            cp -R "$app" ios-artifacts/ 2>/dev/null || true
          done
          ls -la ios-artifacts/ || echo "No .app found — listing build dir:"
          find src-tauri/gen/apple/build -maxdepth 4 -type d | head -20

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts/
          if-no-files-found: warn

  android:
    name: Android Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set NDK environment
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - run: npm ci

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android APK
        run: |
          npx tauri android build --apk 2>&1 | tail -30 || true
          # Fallback: try direct Gradle build if tauri android build fails
          if [ ! -f src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk ]; then
            echo "Tauri APK not found, trying Gradle directly..."
            cd src-tauri/gen/android
            ./gradlew assembleRelease 2>&1 | tail -20 || ./gradlew assembleDebug 2>&1 | tail -20 || true
          fi

      - name: Collect Android build artifacts
        run: |
          mkdir -p android-artifacts
          find src-tauri/gen/android -name "*.apk" -type f | while read apk; do
            cp "$apk" android-artifacts/ 2>/dev/null || true
          done
          ls -la android-artifacts/ || echo "No APKs found — listing build outputs:"
          find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null | head -20 || echo "No build outputs dir"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android-artifacts/
          if-no-files-found: warn

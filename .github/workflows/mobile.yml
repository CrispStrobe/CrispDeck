name: Mobile Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: iOS Build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init || true

      - name: Build iOS (no-codesign)
        run: |
          cd src-tauri/gen/apple
          XCPROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          if [ -z "$XCPROJ" ]; then echo "No xcodeproj found"; ls -la; exit 1; fi
          echo "Found: $XCPROJ"
          xcodebuild -project "$XCPROJ" -list 2>/dev/null || true

          # Build for real device (arm64, unsigned)
          SCHEME=$(xcodebuild -project "$XCPROJ" -list 2>/dev/null | grep -i ios | grep -v -i sim | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -project "$XCPROJ" -list 2>/dev/null | grep -i "scheme" -A20 | grep -v "scheme" | head -1 | xargs)
          fi
          echo "Using scheme: $SCHEME"

          xcodebuild archive \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/CrispDeck.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            2>&1 | tail -40 || true

      - name: Package .ipa from archive
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ -d "CrispDeck.xcarchive/Products/Applications" ]; then
            # Create Payload structure for .ipa
            mkdir -p Payload
            cp -R CrispDeck.xcarchive/Products/Applications/*.app Payload/
            zip -ryq "CrispDeck_${VERSION}_ios-unsigned.ipa" Payload
            echo "Created: CrispDeck_${VERSION}_ios-unsigned.ipa"
            ls -la "CrispDeck_${VERSION}_ios-unsigned.ipa"
          elif [ -d "CrispDeck.xcarchive" ]; then
            echo "Archive exists but no .app in Products/Applications"
            find CrispDeck.xcarchive -name "*.app" -type d 2>/dev/null | head -5
            # Try to find .app anywhere in archive
            APP=$(find CrispDeck.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              mkdir -p Payload
              cp -R "$APP" Payload/
              zip -ryq "CrispDeck_${VERSION}_ios-unsigned.ipa" Payload
              echo "Created from fallback path: CrispDeck_${VERSION}_ios-unsigned.ipa"
            else
              echo "No .app found in archive"
              find CrispDeck.xcarchive -maxdepth 4 -type d | head -20
            fi
          else
            echo "No .xcarchive produced"
          fi

      - name: Upload .ipa to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ipa in CrispDeck_*_ios-unsigned.ipa; do
            if [ -f "$ipa" ]; then
              echo "Uploading $ipa"
              gh release upload "${{ github.ref_name }}" "$ipa" --clobber || true
            fi
          done

      - name: Upload iOS artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: CrispDeck_*_ios-unsigned.ipa
          if-no-files-found: warn

  android:
    name: Android Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set NDK environment
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - run: npm ci

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android debug APK (auto-signed, installable)
        run: |
          npx tauri android build --apk -- --debug 2>&1 | tail -50 || true
          # Fallback: if tauri doesn't support --debug passthrough, build via Gradle
          if ! find src-tauri/gen/android -name "*debug*.apk" -type f | grep -q .; then
            echo "No debug APK from tauri, trying Gradle assembleDebug..."
            cd src-tauri/gen/android
            chmod +x gradlew 2>/dev/null || true
            ./gradlew assembleDebug 2>&1 | tail -30 || true
            cd "$GITHUB_WORKSPACE"
          fi
          # Also try release build
          npx tauri android build --apk 2>&1 | tail -50 || true

      - name: Sign release APK with debug key
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Generate a debug keystore for CI signing
          keytool -genkeypair -v \
            -keystore ci-debug.keystore \
            -alias crispdeck \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CrispDeck CI, O=CrispDeck, C=US" 2>/dev/null || true
          # Find and sign unsigned release APKs
          find src-tauri/gen/android -name "*unsigned*.apk" -type f | while read apk; do
            ALIGNED="${apk%.apk}-aligned.apk"
            zipalign -v 4 "$apk" "$ALIGNED" 2>/dev/null || cp "$apk" "$ALIGNED"
            apksigner sign --ks ci-debug.keystore --ks-pass pass:android --ks-key-alias crispdeck --key-pass pass:android "$ALIGNED" 2>/dev/null || true
            if apksigner verify "$ALIGNED" 2>/dev/null; then
              echo "Signed: $ALIGNED"
            fi
          done

      - name: Collect APKs
        run: |
          mkdir -p android-artifacts
          VERSION=$(node -p "require('./package.json').version")
          # Collect debug APKs (auto-signed, installable)
          find src-tauri/gen/android -name "*debug*.apk" -type f | while read apk; do
            cp "$apk" "android-artifacts/CrispDeck_${VERSION}_android-debug.apk" 2>/dev/null
            break  # take first
          done
          # Collect signed release APKs
          find src-tauri/gen/android -name "*aligned*.apk" -type f | while read apk; do
            cp "$apk" "android-artifacts/CrispDeck_${VERSION}_android-release.apk" 2>/dev/null
            break
          done
          # Fallback: any APK
          if [ -z "$(ls android-artifacts/*.apk 2>/dev/null)" ]; then
            find src-tauri/gen/android -name "*.apk" -type f | head -1 | while read apk; do
              cp "$apk" "android-artifacts/CrispDeck_${VERSION}_android.apk"
            done
          fi
          ls -la android-artifacts/

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for apk in android-artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "Uploading $apk"
              gh release upload "${{ github.ref_name }}" "$apk" --clobber || true
            fi
          done

      - name: Upload Android artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android-artifacts/
          if-no-files-found: warn

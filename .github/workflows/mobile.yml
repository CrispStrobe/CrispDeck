name: Mobile Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ios:
    name: iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init || true

      - name: Build iOS
        run: npx tauri ios build --export-method app-store-connect || echo "iOS build requires signing — skipping in CI"

  android:
    name: Android Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - run: npm ci

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android APK
        run: npx tauri android build --apk || echo "Android build may need additional setup"

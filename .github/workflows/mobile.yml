name: Mobile Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init || true

      - name: Build iOS (unsigned debug for simulator)
        run: |
          cd src-tauri/gen/apple
          XCPROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          if [ -z "$XCPROJ" ]; then echo "No xcodeproj found"; ls -la; exit 1; fi
          echo "Found project: $XCPROJ"
          xcodebuild -project "$XCPROJ" -list 2>/dev/null | head -20 || true
          SCHEME=$(xcodebuild -project "$XCPROJ" -list 2>/dev/null | grep -i ios | head -1 | xargs || echo "${XCPROJ%.xcodeproj}_iOS")
          echo "Using scheme: $SCHEME"
          xcodebuild -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -30 || echo "iOS build completed with warnings"

      - name: Package iOS simulator app
        run: |
          APP=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            cd "$(dirname "$APP")"
            tar czf "$GITHUB_WORKSPACE/CrispDeck_ios-simulator.tar.gz" "$(basename "$APP")"
            echo "Packaged: CrispDeck_ios-simulator.tar.gz"
          else
            echo "No .app found — iOS build may have failed"
            find src-tauri/gen/apple -maxdepth 5 -name "*.app" -o -name "*.xcodeproj" 2>/dev/null | head -10
          fi

      - name: Upload iOS to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f CrispDeck_ios-simulator.tar.gz ]; then
            gh release upload "${{ github.ref_name }}" CrispDeck_ios-simulator.tar.gz --clobber || true
          fi

      - name: Upload iOS artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: CrispDeck_ios-simulator.tar.gz
          if-no-files-found: warn

  android:
    name: Android Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set NDK environment
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - run: npm ci

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android APK
        run: npx tauri android build --apk 2>&1 | tail -50

      - name: Collect and rename APKs
        run: |
          mkdir -p android-artifacts
          # Find all APKs and copy with version-stamped names
          VERSION=$(node -p "require('./package.json').version")
          find src-tauri/gen/android -name "*.apk" -type f | while read apk; do
            BASENAME=$(basename "$apk" .apk)
            cp "$apk" "android-artifacts/CrispDeck_${VERSION}_${BASENAME}.apk"
          done
          ls -la android-artifacts/

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for apk in android-artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "Uploading $apk to release ${{ github.ref_name }}"
              gh release upload "${{ github.ref_name }}" "$apk" --clobber || true
            fi
          done

      - name: Upload Android artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android-artifacts/
          if-no-files-found: warn

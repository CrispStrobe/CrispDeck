name: Mobile Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: iOS Build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init || true

      - name: Build iOS
        run: |
          # Patch xcodeproj to disable code signing for CI
          cd src-tauri/gen/apple
          XCPROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          if [ -n "$XCPROJ" ]; then
            # Disable code signing in pbxproj
            sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' "$XCPROJ/project.pbxproj" 2>/dev/null || true
            sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' "$XCPROJ/project.pbxproj" 2>/dev/null || true
            # Add CODE_SIGNING_ALLOWED = NO if not present
            sed -i '' 's/CODE_SIGN_IDENTITY = "";/CODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/g' "$XCPROJ/project.pbxproj" 2>/dev/null || true
          fi
          cd "$GITHUB_WORKSPACE"
          # Build with tauri — handles Rust cross-compile + xcodebuild
          npx tauri ios build 2>&1 | tail -50 || true
          # Fallback: direct xcodebuild if tauri build fails
          if ! find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | grep -q .; then
            echo "Tauri build didn't produce .app, trying xcodebuild directly..."
            cd src-tauri/gen/apple
            xcodebuild -project "$XCPROJ" \
              -scheme "crispdeck_iOS" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              2>&1 | tail -30 || true
          fi

      - name: Package .ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Find any .app or .ipa that tauri produced
          echo "=== Looking for build products ==="
          find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -5
          find src-tauri/gen/apple -name "*.ipa" -type f 2>/dev/null | head -5
          find src-tauri/target -name "*.app" -type d 2>/dev/null | head -5

          # Try to find .app and package as .ipa
          APP=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -ryq "CrispDeck_${VERSION}_ios-unsigned.ipa" Payload
            echo "Created: CrispDeck_${VERSION}_ios-unsigned.ipa"
            ls -la "CrispDeck_${VERSION}_ios-unsigned.ipa"
          else
            # Check if tauri produced an .ipa directly
            IPA=$(find src-tauri -name "*.ipa" -type f 2>/dev/null | head -1)
            if [ -n "$IPA" ]; then
              cp "$IPA" "CrispDeck_${VERSION}_ios-unsigned.ipa"
              echo "Found tauri-produced IPA: CrispDeck_${VERSION}_ios-unsigned.ipa"
            else
              echo "No .app or .ipa found"
              echo "=== Build directory listing ==="
              find src-tauri/gen/apple -maxdepth 5 -type f -name "*.app" -o -name "*.ipa" -o -name "*.xcarchive" 2>/dev/null | head -20
            fi
          fi

      - name: Upload .ipa to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ipa in CrispDeck_*_ios-unsigned.ipa; do
            if [ -f "$ipa" ]; then
              echo "Uploading $ipa"
              gh release upload "${{ github.ref_name }}" "$ipa" --clobber || true
            fi
          done

      - name: Upload iOS artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: CrispDeck_*_ios-unsigned.ipa
          if-no-files-found: warn

  android:
    name: Android Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set NDK environment
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - run: npm ci

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android debug APK (auto-signed, installable)
        run: |
          npx tauri android build --apk -- --debug 2>&1 | tail -50 || true
          # Fallback: if tauri doesn't support --debug passthrough, build via Gradle
          if ! find src-tauri/gen/android -name "*debug*.apk" -type f | grep -q .; then
            echo "No debug APK from tauri, trying Gradle assembleDebug..."
            cd src-tauri/gen/android
            chmod +x gradlew 2>/dev/null || true
            ./gradlew assembleDebug 2>&1 | tail -30 || true
            cd "$GITHUB_WORKSPACE"
          fi
          # Also try release build
          npx tauri android build --apk 2>&1 | tail -50 || true

      - name: Sign release APK with debug key
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Generate a debug keystore for CI signing
          keytool -genkeypair -v \
            -keystore ci-debug.keystore \
            -alias crispdeck \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CrispDeck CI, O=CrispDeck, C=US" 2>/dev/null || true
          # Find and sign unsigned release APKs
          find src-tauri/gen/android -name "*unsigned*.apk" -type f | while read apk; do
            ALIGNED="${apk%.apk}-aligned.apk"
            zipalign -v 4 "$apk" "$ALIGNED" 2>/dev/null || cp "$apk" "$ALIGNED"
            apksigner sign --ks ci-debug.keystore --ks-pass pass:android --ks-key-alias crispdeck --key-pass pass:android "$ALIGNED" 2>/dev/null || true
            if apksigner verify "$ALIGNED" 2>/dev/null; then
              echo "Signed: $ALIGNED"
            fi
          done

      - name: Collect APKs
        run: |
          mkdir -p android-artifacts
          VERSION=$(node -p "require('./package.json').version")
          # Collect debug APKs (auto-signed, installable)
          find src-tauri/gen/android -name "*debug*.apk" -type f | while read apk; do
            cp "$apk" "android-artifacts/CrispDeck_${VERSION}_android-debug.apk" 2>/dev/null
            break  # take first
          done
          # Collect signed release APKs
          find src-tauri/gen/android -name "*aligned*.apk" -type f | while read apk; do
            cp "$apk" "android-artifacts/CrispDeck_${VERSION}_android-release.apk" 2>/dev/null
            break
          done
          # Fallback: any APK
          if [ -z "$(ls android-artifacts/*.apk 2>/dev/null)" ]; then
            find src-tauri/gen/android -name "*.apk" -type f | head -1 | while read apk; do
              cp "$apk" "android-artifacts/CrispDeck_${VERSION}_android.apk"
            done
          fi
          ls -la android-artifacts/

      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for apk in android-artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "Uploading $apk"
              gh release upload "${{ github.ref_name }}" "$apk" --clobber || true
            fi
          done

      - name: Upload Android artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android-artifacts/
          if-no-files-found: warn

name: Mobile Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (see /mnt/volume1/appstore.md for full playbook):
#
# iOS (App Store Connect API key — same key used for CrispChess / CrispSudoku):
#   APPLE_API_KEY_P8    – content of the AuthKey_<KEYID>.p8 file
#   APPLE_API_KEY_ID    – Key ID (shown in App Store Connect)
#   APPLE_API_ISSUER_ID – Issuer ID (shown in App Store Connect)
#   APPLE_TEAM_ID       – 10-character Developer Team ID (seedId from bundle-id endpoint)
#
# Android (Google Play):
#   ANDROID_KEYSTORE_BASE64    – base64-encoded release keystore (.jks / .keystore)
#   ANDROID_KEYSTORE_PASSWORD  – keystore password
#   ANDROID_KEY_ALIAS          – key alias within the keystore
#   ANDROID_KEY_PASSWORD       – key password
#
# When iOS signing secrets are absent the workflow produces an unsigned .ipa
# for sideloading / QA only.  Android falls back to a debug-keystore APK.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────── iOS ────────────────────────────────────────
  ios:
    name: iOS Build
    if: github.event_name == 'push' || inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_API_KEY_P8:    ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_P12:        ${{ secrets.IOS_DIST_P12 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Require production signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -n "$APPLE_API_KEY_P8" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER_ID" && test -n "$APPLE_TEAM_ID" && test -n "$IOS_DIST_P12" && test -n "$IOS_DIST_P12_PASSWORD" \
            || { echo "::error::Tagged iOS releases require Apple signing credentials"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Generate all platform icons (desktop + iOS AppIcon.appiconset) from 1024px source
      - name: Generate app icons
        run: npx tauri icon static/icon-1024.png

      # Generates the Xcode project in src-tauri/gen/apple/
      # Our seed files (Info.plist, PrivacyInfo.xcprivacy) are committed and
      # will be left in place — tauri ios init does not overwrite existing files.
      - name: Initialize iOS project
        run: npx tauri ios init

      # The committed Info.plist is the seed `tauri ios init` preserves, so its
      # version drifts silently whenever package.json is bumped and nobody
      # remembers to edit it too. Apple compares CFBundleShortVersionString
      # against the version declared in App Store Connect, so a stale value is
      # an upload rejection (or, worse, a build landing under the old version).
      # It went out of step between 1.2.6 and 1.2.7; sync it here so it cannot
      # happen again.
      - name: Sync iOS bundle version with package.json
        run: |
          PLIST=src-tauri/gen/apple/CrispDeck_iOS/Info.plist
          VERSION=$(node -p "require('./package.json').version")
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "Info.plist said $CURRENT, package.json says $VERSION — syncing"
            /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST"

          # CFBundleVersion is the *build* number, and it was committed as "1"
          # with nothing ever bumping it. App Store Connect requires it to be
          # unique and increasing within a marketing version, so the first
          # upload of 1.2.8 worked and every later one was refused — which is
          # precisely the loop TestFlight puts you in: ship, get feedback, fix,
          # ship again. The run number is monotonic per repository and needs no
          # state kept anywhere.
          # Kept for a local `tauri ios build`, which does read this file. CI
          # cannot rely on it: the bundler regenerates the plist, so the value
          # that reaches the binary is the one set on the archive below.
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${{ github.run_number }}" "$PLIST"
          echo "source plist build number: $(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")"

      # Inject PrivacyInfo.xcprivacy into the Xcode project target
      - name: Inject PrivacyInfo.xcprivacy
        run: python3 scripts/patch-ios-privacy.py

      # ── Production signing via App Store Connect API key ─────────────────
      - name: Setup App Store Connect API key
        id: api_key
        if: >
          env.APPLE_API_KEY_P8 != '' &&
          env.APPLE_API_KEY_ID != '' &&
          env.APPLE_API_ISSUER_ID != '' &&
          env.APPLE_TEAM_ID != ''
        run: |
          # Install key where both xcodebuild and altool find it by default
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          # Import Distribution cert + private key into a build keychain
          KEYCHAIN="build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          if [ -n "$IOS_DIST_P12" ]; then
            echo "$IOS_DIST_P12" | base64 -d > /tmp/dist.p12
            security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm /tmp/dist.p12
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning | grep -i "distribution" \
            || { echo "::error::The retained Distribution identity is missing; refusing automatic certificate creation"; exit 1; }

          # Set Automatic signing in the Xcode project with our Team ID
          cd src-tauri/gen/apple
          XCPROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          if [ -n "$XCPROJ" ]; then
            # Target-level: Automatic signing + team
            sed -i '' \
              "s/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Automatic;/g" \
              "$XCPROJ/project.pbxproj" 2>/dev/null || true
            sed -i '' \
              "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" \
              "$XCPROJ/project.pbxproj" 2>/dev/null || true
            # Remove any previous disable-signing patches
            sed -i '' \
              '/CODE_SIGNING_REQUIRED = NO/d;/CODE_SIGNING_ALLOWED = NO/d' \
              "$XCPROJ/project.pbxproj" 2>/dev/null || true
            # Remove project-level CODE_SIGN_IDENTITY override (classic Flutter gotcha —
            # also produced by some Tauri pbxproj templates; causes export to re-sign
            # embedded frameworks with the wrong identity)
            sed -i '' \
              '/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]/d' \
              "$XCPROJ/project.pbxproj" 2>/dev/null || true
          fi

          echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            >> "$GITHUB_ENV"

      # ── Pre-resolve provisioning profiles via xcodebuild ──────────────
      # Tauri's `--` pass-through doesn't forward all xcodebuild auth flags.
      # Work around: call xcodebuild directly with auth flags first — it will
      # fail at the "Build Rust Code" script phase (no Tauri build server),
      # BUT provisioning profile resolution happens BEFORE build phases, so
      # the profile gets downloaded and cached in ~/Library/MobileDevice/.
      # Then `tauri ios build` finds the cached profile and succeeds.
      - name: Pre-resolve provisioning profiles
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          # Inject DEVELOPMENT_TEAM into pbxproj (insert, not replace — key
          # may not exist in the generated file). Use env var for actual value.
          TEAM="$APPLE_TEAM_ID"
          python3 -c "
          import re, os
          team = os.environ['APPLE_TEAM_ID']
          pbxproj = 'src-tauri/gen/apple/crispdeck.xcodeproj/project.pbxproj'
          with open(pbxproj) as f: content = f.read()
          if 'DEVELOPMENT_TEAM' not in content:
              content = content.replace(
                  'buildSettings = {',
                  f'buildSettings = {{\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tCODE_SIGN_STYLE = Automatic;'
              )
          else:
              content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = {team};', content)
          with open(pbxproj, 'w') as f: f.write(content)
          print(f'Patched DEVELOPMENT_TEAM = {team}')
          "

          # Call xcodebuild to trigger provisioning AND certificate resolution.
          # Use the "archive" action (not just "build") because archiving is
          # what triggers Xcode to create/download the DISTRIBUTION certificate.
          # A plain "build" only resolves Development identity.
          # This WILL fail at the Rust build script phase (no Tauri server) —
          # that's expected. Certificate + profile resolution happens BEFORE
          # build phases, so both get downloaded and cached.
          cd src-tauri/gen/apple
          XCPROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          echo "Pre-resolving provisioning + Distribution cert for $XCPROJ ..."
          xcodebuild \
            -project "$XCPROJ" \
            -scheme crispdeck_iOS \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive \
            -archivePath /tmp/pre-resolve.xcarchive \
            2>&1 | tail -20 || echo "Expected failure (no Tauri build server) — cert + provisioning should be cached"

          # Also verify the Distribution certificate is now in the keychain
          echo "=== Distribution certificates in keychain ==="
          security find-identity -v -p codesigning | grep -i "distribution\|apple dist" || echo "WARNING: No Distribution cert found"

          # Verify profiles were downloaded
          echo "=== Provisioning profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles dir yet"

      # ── Build via tauri ios build (Rust + frontend + xcodebuild) ─────────
      # Do NOT pass --export-method here. That flag causes Tauri to internally
      # run xcodebuild -exportArchive WITHOUT API key auth flags, which means
      # Xcode cannot download/create a Distribution certificate and falls back
      # to the Development identity. We only want Tauri to produce the
      # .xcarchive; the separate "Export IPA from archive" step below handles
      # Distribution re-signing with explicit auth flags.
      - name: Build iOS app (archive only)
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          export PATH="/usr/bin:$PATH"
          npx tauri ios build 2>&1 | tail -80

      # tauri ios build produces an .xcarchive (signed .app inside) but
      # NOT an .ipa. Run xcodebuild -exportArchive to create the IPA.
      - name: Export IPA from archive
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE=$(find src-tauri -name "*.xcarchive" -type d 2>/dev/null | head -1)
          echo "Archive: $ARCHIVE"

          # The build number has to be set HERE, on the archive, not on
          # src-tauri/gen/apple/*/Info.plist before the build: `tauri ios build`
          # regenerates that file, so the value written earlier never reached
          # the binary. App Store Connect reported the first 1.2.9 iOS build as
          # version "1.2.9" while the macOS one — where the plist is edited
          # after the bundler has run — correctly reported its run number.
          # Same class of mistake as editing a generated file anywhere else.
          #
          # -exportArchive re-signs, so editing the plist now is safe; editing
          # it after export would invalidate the signature.
          APP_PLIST=$(find "$ARCHIVE/Products/Applications" -name Info.plist -maxdepth 2 | head -1)
          [ -n "$APP_PLIST" ] || { echo "::error::no app Info.plist inside the archive"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion ${{ github.run_number }}" "$ARCHIVE/Info.plist"
          echo "archive build number: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"

          # Write ExportOptions.plist
          python3 -c "
          import os
          t = os.environ['APPLE_TEAM_ID']
          open('/tmp/ExportOptions.plist','w').write(f'''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>{t}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>''')
          "

          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            2>&1 | tail -20

          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            cp "$IPA" "CrispDeck_${VERSION}_ios-appstore.ipa"
            echo "Exported IPA: $(ls -lh CrispDeck_${VERSION}_ios-appstore.ipa)"
            # Verify signature
            mkdir -p /tmp/ipa_check && cd /tmp/ipa_check
            unzip -q "$GITHUB_WORKSPACE/CrispDeck_${VERSION}_ios-appstore.ipa"

            # Assert, because the last attempt at this looked fine in the log
            # and shipped the wrong number anyway. A duplicate build number is
            # refused by App Store Connect and the upload cannot be undone.
            GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/*.app/Info.plist)
            echo "IPA build number: $GOT"
            [ "$GOT" = "${{ github.run_number }}" ] || {
              echo "::error::IPA carries CFBundleVersion $GOT, expected ${{ github.run_number }}"
              exit 1
            }
            codesign --verify --deep --strict --verbose=2 Payload/*.app 2>&1 | tail -5
          else
            echo "ERROR: exportArchive produced no IPA"
            ls -la "$RUNNER_TEMP/export/" 2>/dev/null || true
            DISTLOG=$(ls -td /var/folders/*/*/T/*xcdistributionlogs* 2>/dev/null | head -1)
            [ -n "$DISTLOG" ] && grep -n "Step failed\|error" "$DISTLOG/IDEDistribution.verbose.log" 2>/dev/null | tail -20 || true
            exit 1
          fi

      # Upload to App Store Connect (validate then upload)
      - name: Upload IPA to App Store Connect
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPA="CrispDeck_${VERSION}_ios-appstore.ipa"
          [ -f "$IPA" ] || { echo "::error::No IPA to upload"; exit 1; }

          echo "=== Validating IPA ==="
          xcrun altool --validate-app \
            -f "$IPA" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

          echo "=== Uploading to App Store Connect ==="
          xcrun altool --upload-package "$IPA" \
            --type ios \
            --apple-id 6789569440 \
            --bundle-id com.christianstrobele.crispdeck \
            --bundle-version "${{ github.run_number }}" \
            --bundle-short-version-string "$VERSION" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

          echo "Upload complete — build will process in 15-60 min"

      # ── Unsigned fallback (no API key secrets) ───────────────────────────
      - name: Build unsigned iOS (no signing secrets)
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          cd src-tauri/gen/apple
          XCPROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          if [ -n "$XCPROJ" ]; then
            sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' \
              "$XCPROJ/project.pbxproj" 2>/dev/null || true
            sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' \
              "$XCPROJ/project.pbxproj" 2>/dev/null || true
          fi
          cd "$GITHUB_WORKSPACE"
          npx tauri ios build 2>&1 | tail -50 || true

      - name: Package unsigned IPA
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1)
          IPA=$(find src-tauri -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            mkdir -p Payload && cp -R "$APP" Payload/
            zip -ryq "CrispDeck_${VERSION}_ios-unsigned.ipa" Payload
          elif [ -n "$IPA" ]; then
            cp "$IPA" "CrispDeck_${VERSION}_ios-unsigned.ipa"
          else
            echo "No .app or .ipa found"
          fi

      - name: Upload IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ipa in CrispDeck_*_ios-*.ipa; do
            [ -f "$ipa" ] || { echo "::error::iOS release IPA missing"; exit 1; }
            gh release upload "${{ github.ref_name }}" "$ipa" --clobber
          done

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: CrispDeck_*_ios-*.ipa
          if-no-files-found: error

  # ─────────────────────────── Android ─────────────────────────────────────
  android:
    name: Android Build
    if: github.event_name == 'push' || inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS:          ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD:       ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@v5

      - name: Require production signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" \
            || { echo "::error::Tagged Android releases require a retained production keystore"; exit 1; }
          test -n "$ANDROID_RELEASE_CERT_SHA256" \
            || { echo "::error::Pin the production certificate in ANDROID_RELEASE_CERT_SHA256"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set NDK environment
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - run: npm ci

      - name: Initialize Android project
        run: npx tauri android init

      # ── Production keystore (Play Store) ─────────────────────────────────
      - name: Setup production keystore
        if: >
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      # ── Debug-keystore fallback ──────────────────────────────────────────
      - name: Setup debug keystore fallback
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>/dev/null || true

      - name: Patch Gradle signing config
        run: python3 scripts/patch-android-signing.py
        env:
          ANDROID_KEYSTORE_PATH:     ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ env.ANDROID_KEY_PASSWORD }}

      - name: Build Android packages
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            npx tauri android build --apk --aab --ci
          else
            npx tauri android build --apk --ci
          fi

      - name: Collect artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p android-artifacts
          SUFFIX=$( [ "$SIGNING_CONFIGURED" = "true" ] && echo "release" || echo "debug-signed" )
          APK=$(find src-tauri/gen/android -name "*.apk" -type f -path "*/release/*" | head -1)
          [ -n "$APK" ] || { echo "::error::No release APK produced"; exit 1; }
          cp "$APK" "android-artifacts/CrispDeck_${VERSION}_android_${SUFFIX}.apk"
          AAB=$(find src-tauri/gen/android -name "*.aab" -type f | head -1)
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            [ -n "$AAB" ] || { echo "::error::No release AAB produced"; exit 1; }
            cp "$AAB" "android-artifacts/CrispDeck_${VERSION}_android_${SUFFIX}.aab"
          fi
          ls -lh android-artifacts/ || echo "No artifacts"

      - name: Verify Android signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in android-artifacts/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
            if [ "$SIGNING_CONFIGURED" = "true" ]; then
              GOT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
              [ "$GOT" = "$ANDROID_RELEASE_CERT_SHA256" ] \
                || { echo "::error::APK certificate differs from the retained release identity"; exit 1; }
              VERSION=$(node -p "require('./package.json').version")
              echo "$GOT" > "android-artifacts/CrispDeck_${VERSION}_android-cert.sha256"
            fi
          done
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            for aab in android-artifacts/*.aab; do
              jarsigner -verify "$aab" | grep -q 'jar verified'
            done
          fi

      - name: Upload Android artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in android-artifacts/*; do
            [ -f "$f" ] || { echo "::error::Android release artifacts missing"; exit 1; }
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android-artifacts/
          if-no-files-found: error

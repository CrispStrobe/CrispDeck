name: Mobile Build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      platform:
        type: string
        default: both
      build_number:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      build_number:
        description: iOS build number for build-only output
        type: string
        default: ''
      platform:
        description: 'Platform to build'
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: read

defaults:
  run:
    shell: bash

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (see /mnt/volume1/appstore.md for full playbook):
#
# iOS (local retained signing; API credentials belong to the coordinator):
#   APPLE_TEAM_ID               – 10-character Developer Team ID
#   IOS_DIST_P12                – base64 of the retained Distribution identity
#   IOS_DIST_P12_PASSWORD       – password of that retained PKCS#12 file
#   IOS_APPSTORE_PROFILE_BASE64 – explicit App Store profile matching that identity
#
# Android (Google Play):
#   ANDROID_KEYSTORE_BASE64    – base64-encoded release keystore (.jks / .keystore)
#   ANDROID_KEYSTORE_PASSWORD  – keystore password
#   ANDROID_KEY_ALIAS          – key alias within the keystore
#   ANDROID_KEY_PASSWORD       – key password
#
# This builder only emits production-signed packages. It never publishes or
# uploads to Apple; the coordinator owns distribution after all six pass.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────── iOS ────────────────────────────────────────
  ios:
    name: iOS Build
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_P12:        ${{ secrets.IOS_DIST_P12 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Require production signing credentials
        run: |
          test -n "$APPLE_TEAM_ID" && test -n "$IOS_DIST_P12" && test -n "$IOS_DIST_P12_PASSWORD" && test -n "$IOS_APPSTORE_PROFILE_BASE64" \
            || { echo "::error::iOS packages require Apple signing credentials"; exit 1; }
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::Invalid iOS build number"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - run: npm ci

      # Generate all platform icons (desktop + iOS AppIcon.appiconset) from 1024px source
      - name: Generate app icons
        run: npx tauri icon static/icon-1024.png

      # Generates the Xcode project in src-tauri/gen/apple/
      # Versionless customizations live in src-tauri/Info.ios.plist. Generated
      # project paths can change with Tauri and must not be the source of truth.
      - name: Initialize iOS project
        run: npx tauri ios init

      # Inject PrivacyInfo.xcprivacy into the Xcode project target
      - name: Inject PrivacyInfo.xcprivacy
        run: python3 scripts/patch-ios-privacy.py

      - name: Import the retained Distribution identity
        run: |
          KEYCHAIN="build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_DIST_P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          python3 - <<'PYTHON'
          import shlex, subprocess
          previous = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', 'build.keychain-db', *previous], check=True)
          PYTHON
          echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Validate the explicit App Store profile and prepare manual export
        run: |
          python3 scripts/ios-signing.py prepare --bundle com.christianstrobele.crispdeck \
            --team "$APPLE_TEAM_ID" --keychain build.keychain-db --output "$RUNNER_TEMP/ios-signing"
          mkdir -p "$RUNNER_TEMP/xcode-offline" "$RUNNER_TEMP/ios-smoke"
          install -m 755 scripts/xcodebuild-offline.py "$RUNNER_TEMP/xcode-offline/xcodebuild"
          printf '%s' "$RUNNER_TEMP/ios-smoke/xcodebuild-guard.jsonl" > "$RUNNER_TEMP/xcode-offline/xcodebuild.log-path"
          echo "$RUNNER_TEMP/xcode-offline" >> "$GITHUB_PATH"
          echo "CRISPDECK_XCODE_GUARD_LOG=$RUNNER_TEMP/ios-smoke/xcodebuild-guard.jsonl" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/ios-signing/signing-metadata.json" "$RUNNER_TEMP/ios-smoke/"

      # Tauri 2.11 adds automatic-provisioning flags even when signing is skipped.
      # The PATH wrapper removes those flags; the archive is signed only at export.
      - name: Build an unsigned iOS archive
        run: |
          npx tauri ios build --no-sign --archive-only --ci 2>&1 | tail -80
          python3 scripts/ios-signing.py verify-guard --log "$CRISPDECK_XCODE_GUARD_LOG"

      # Sign the unsigned archive with the exact retained identity/profile.
      - name: Export IPA from archive
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE=$(find src-tauri -name "*.xcarchive" -type d 2>/dev/null | head -1)
          echo "Archive: $ARCHIVE"

          # The build number has to be set HERE, on the archive, not on
          # src-tauri/gen/apple/*/Info.plist before the build: `tauri ios build`
          # regenerates that file, so the value written earlier never reached
          # the binary. App Store Connect reported the first 1.2.9 iOS build as
          # version "1.2.9" while the macOS one — where the plist is edited
          # after the bundler has run — correctly reported its run number.
          # Same class of mistake as editing a generated file anywhere else.
          #
          # -exportArchive re-signs, so editing the plist now is safe; editing
          # it after export would invalidate the signature.
          APP_PLIST=$(find "$ARCHIVE/Products/Applications" -name Info.plist -maxdepth 2 | head -1)
          [ -n "$APP_PLIST" ] || { echo "::error::no app Info.plist inside the archive"; exit 1; }
          python3 scripts/ios-release-metadata.py apply "$APP_PLIST" src-tauri/Info.ios.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $IOS_BUILD_NUMBER" "$ARCHIVE/Info.plist"
          echo "archive build number: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"

          /usr/bin/xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$IOS_EXPORT_OPTIONS" \
            2>&1 | tail -20

          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            cp "$IPA" "CrispDeck_${VERSION}_ios-appstore.ipa"
            echo "Exported IPA: $(ls -lh "CrispDeck_${VERSION}_ios-appstore.ipa")"
            # Verify signature
            mkdir -p /tmp/ipa_check && cd /tmp/ipa_check
            unzip -q "$GITHUB_WORKSPACE/CrispDeck_${VERSION}_ios-appstore.ipa"

            # Assert, because the last attempt at this looked fine in the log
            # and shipped the wrong number anyway. A duplicate build number is
            # refused by App Store Connect and the upload cannot be undone.
            GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/*.app/Info.plist)
            echo "IPA build number: $GOT"
            [ "$GOT" = "$IOS_BUILD_NUMBER" ] || {
              echo "::error::IPA carries CFBundleVersion $GOT, expected $IOS_BUILD_NUMBER"
              exit 1
            }
            python3 "$GITHUB_WORKSPACE/scripts/ios-release-metadata.py" verify \
              "$GITHUB_WORKSPACE/CrispDeck_${VERSION}_ios-appstore.ipa" "$VERSION" "$IOS_BUILD_NUMBER"
            codesign --verify --deep --strict --verbose=2 Payload/*.app 2>&1 | tail -5
            python3 "$GITHUB_WORKSPACE/scripts/ios-signing.py" verify-app --app Payload/*.app \
              --identity "$IOS_SIGNING_SHA1" | tee "$RUNNER_TEMP/ios-smoke/device-signing.json"
          else
            echo "ERROR: exportArchive produced no IPA"
            ls -la "$RUNNER_TEMP/export/" 2>/dev/null || true
            DISTLOG=$(find /var/folders -type d -name '*xcdistributionlogs*' -print -quit 2>/dev/null || true)
            [ -n "$DISTLOG" ] && grep -n "Step failed\|error" "$DISTLOG/IDEDistribution.verbose.log" 2>/dev/null | tail -20 || true
            exit 1
          fi

      - name: Build and launch the native iPhone simulator app
        run: |
          if [ "$(uname -m)" = arm64 ]; then TARGET=aarch64-sim; else TARGET=x86_64; fi
          npx tauri ios build --target "$TARGET" 2>&1 | tail -70
          python3 tools/validation/mobile_smoke.py ios --output "$RUNNER_TEMP/ios-smoke"
      - name: Retain iPhone simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ios
          path: ${{ runner.temp }}/ios-smoke/
          if-no-files-found: warn
      - name: Collect verified iOS package and source receipt
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ios-artifacts
          cp "CrispDeck_${VERSION}_ios-appstore.ipa" ios-artifacts/
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ios-smoke'
          result = json.loads((root / 'checks.json').read_text())
          signing = json.loads((root / 'device-signing.json').read_text())
          result['checks']['retained_identity'] = signing['retained_identity']
          result['metadata']['device_ipa_certificate_sha1'] = signing['exported_device_ipa_certificate_sha1']
          (root / 'checks.json').write_text(json.dumps(result, indent=2) + '\n')
          PYTHON
          python3 tools/release/manifest.py receipt ios ios-artifacts --check codesign --check retained_identity --check metadata --build-number "$IOS_BUILD_NUMBER" --checks-file "$RUNNER_TEMP/ios-smoke/checks.json"
      - uses: actions/upload-artifact@v4
        with:
          name: package-ios
          path: ios-artifacts/
          if-no-files-found: error

  # ─────────────────────────── Android ─────────────────────────────────────
  android:
    name: Android Build
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS:          ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD:       ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Require production signing credentials
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" \
            || { echo "::error::Android packages require a retained production keystore"; exit 1; }
          test -n "$ANDROID_RELEASE_CERT_SHA256" \
            || { echo "::error::Pin the production certificate in ANDROID_RELEASE_CERT_SHA256"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # A later packaging/signature failure does not invalidate compiled Rust.
          cache-on-failure: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set NDK environment
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Initialize Android project
        run: |
          set -euo pipefail
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          cp "$MANIFEST" "$RUNNER_TEMP/crispdeck-manifest.xml"
          # The repository carries a customized manifest, not a full generated
          # Java/Gradle project. Initialize in a clean disposable CI directory.
          rm -rf src-tauri/gen/android
          npx tauri icon static/icon-1024.png
          npx tauri android init --ci --skip-targets-install
          python3 scripts/merge-android-manifest.py "$RUNNER_TEMP/crispdeck-manifest.xml" "$MANIFEST"
          ACTIVITY=src-tauri/gen/android/app/src/main/java/com/christianstrobele/crispdeck/MainActivity.kt
          test -f "$ACTIVITY"
          cp src-tauri/android/MainActivity.kt "$ACTIVITY"

      # ── Production keystore (Play Store) ─────────────────────────────────
      - name: Setup production keystore
        if: >
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Patch Gradle signing config
        run: python3 scripts/patch-android-signing.py
        env:
          ANDROID_KEYSTORE_PATH:     ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ env.ANDROID_KEY_PASSWORD }}

      - name: Build Android packages
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            npx tauri android build --apk --aab --ci
          else
            npx tauri android build --apk --ci
          fi

      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p android-artifacts
          SUFFIX=$( [ "$SIGNING_CONFIGURED" = "true" ] && echo "release" || echo "debug-signed" )
          APK=$(python3 scripts/find-android-artifact.py apk)
          [ -n "$APK" ] || { echo "::error::No release APK produced"; exit 1; }
          cp "$APK" "android-artifacts/CrispDeck_${VERSION}_android_${SUFFIX}.apk"
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            AAB=$(python3 scripts/find-android-artifact.py aab)
            [ -n "$AAB" ] || { echo "::error::No release AAB produced"; exit 1; }
            cp "$AAB" "android-artifacts/CrispDeck_${VERSION}_android_${SUFFIX}.aab"
          fi
          ls -lh android-artifacts/ || echo "No artifacts"

      - name: Verify Android signatures, identity and 16 KiB compatibility
        run: |
          python3 tools/release/packages.py android android-artifacts --sdk "$ANDROID_HOME" --certificate "$ANDROID_RELEASE_CERT_SHA256"
          python3 tools/release/manifest.py receipt android android-artifacts --check apk_signature --check aab_signature --check certificate --check alignment --check metadata --certificate "$ANDROID_RELEASE_CERT_SHA256"

      - name: Upload Android artifact
        # Retain failed candidates for diagnosis; release upload still requires verification.
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: android-artifacts/
          if-no-files-found: error

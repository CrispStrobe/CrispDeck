# Put an uploaded build in front of TestFlight testers, internal or external.
#
# mobile.yml and macos-appstore.yml build, sign and upload. That is only half
# the job: an uploaded build reaches *internal* testers once it finishes
# processing, but external testers need an external group, the beta review
# details filled in, and a pass through Apple's Beta App Review. None of that
# existed anywhere in this repo, so it was being done by hand or not at all.
#
# Everything here is the App Store Connect API — no Xcode, no Mac, no browser.
# Runs on ubuntu because nothing is compiled.
#
# Deliberately workflow_dispatch only. Submitting to Beta App Review is an
# outward-facing action against Apple under a real developer account; it should
# be somebody pressing a button, never a side effect of pushing a tag.
#
# dry_run defaults to TRUE: it reads the state and prints exactly what it would
# do, changing nothing. Turn it off when you mean it.

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen, change nothing'
        type: boolean
        default: true
      mode:
        description: 'Who to distribute to'
        type: choice
        options: [internal, external, both]
        default: internal
      platform:
        description: 'Which build to distribute'
        type: choice
        options: [IOS, MAC_OS]
        default: IOS
      build_id:
        description: 'Build id to use (blank = the newest one that is ready)'
        type: string
        default: ''
      whats_new:
        description: 'What to test, shown to every tester (external only)'
        type: string
        default: ''
      internal_testers:
        description: 'Internal tester emails, comma separated. Must be App Store Connect team members.'
        type: string
        default: ''
      external_testers:
        description: 'External tester emails, comma separated. Anyone; no ASC account needed.'
        type: string
        default: ''    

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet cryptography requests

      - name: Submit for external testing
        env:
          # The .p8 is stored raw, not base64 — see the note in
          # macos-appstore.yml about altool and error 259.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_ID: ${{ vars.APPSTORE_APP_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode }}
          PLATFORM: ${{ inputs.platform }}
          BUILD_ID: ${{ inputs.build_id }}
          WHATS_NEW: ${{ inputs.whats_new }}
          INTERNAL_TESTERS: ${{ inputs.internal_testers }}
          EXTERNAL_TESTERS: ${{ inputs.external_testers }}
          # Beta App Review needs someone to contact. The name lives in
          # scripts/testflight.json (it is already the copyright line); the
          # email and phone are personal data and this repository is public.
          # No demo account: CrispDeck signs in to the reviewer's own social
          # account, so there is nothing to hand out — scripts/testflight.json
          # says exactly that in the review notes.
          BETA_REVIEW_EMAIL: ${{ secrets.BETA_REVIEW_EMAIL }}
          BETA_REVIEW_PHONE: ${{ secrets.BETA_REVIEW_PHONE }}
        run: python3 scripts/testflight.py

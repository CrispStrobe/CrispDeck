# Take an uploaded build to TestFlight testers, internal or external.
#
# mobile.yml and macos-appstore.yml build, sign and upload. That is where they
# stop, and an uploaded build reaches nobody on its own: internal testers need
# it added to a group, external testers additionally need a beta description,
# the review contact, and a pass through Beta App Review.
#
# The work is done by tools/asc/testflight.py, which already existed and is
# shared with tools/asc/listing.py and tools/asc/screenshots.py. Everything is
# idempotent, so re-running after a partial failure continues.
#
# Deliberately workflow_dispatch only, with dry_run defaulting to true.
# Submitting to Beta App Review is an outward-facing action against Apple under
# a real developer account; it should be somebody pressing a button, never a
# side effect of pushing a tag.

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read Apple''s real state, write nothing'
        type: boolean
        default: true
      platform:
        description: 'Which build to distribute'
        type: choice
        options: [ios, macos]
        default: ios
      internal_only:
        description: 'Stop after the internal group (no Beta App Review)'
        type: boolean
        default: false
      build_id:
        description: 'A specific build id (blank = the newest live one)'
        type: string
        default: ''
      testers:
        description: 'Internal tester emails, space separated. Must be App Store Connect team members.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet cryptography

      # client.py takes the key from ASC_API_KEY_P8_BASE64 or from a file it
      # looks for. This repo's secret holds the RAW PEM (mobile.yml writes it
      # with printf; macos-appstore.yml has a note about altool failing with
      # "couldn't be opened … (259)" when it is fed through base64 --decode),
      # while other repos on this Apple account store it base64. Write it to
      # the file client.py already checks rather than re-encoding it into an
      # environment variable: GitHub masks the secret in logs, but it would
      # not mask a base64 of the secret.
      - name: Provide the API key where client.py looks for it
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p .appstoreconnect
          key=".appstoreconnect/AuthKey_${ASC_KEY_ID:-9RMU3C7422}.p8"
          umask 077
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$key"
          fi
          grep -q "BEGIN PRIVATE KEY" "$key" \
            || { echo "::error::APPLE_API_KEY_P8 is neither PEM nor base64 PEM"; exit 1; }

      - name: Distribute
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          args=("${{ inputs.platform }}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          [ "${{ inputs.internal_only }}" = "true" ] && args+=(--internal-only)
          [ -n "${{ inputs.build_id }}" ] && args+=(--build "${{ inputs.build_id }}")
          for t in ${{ inputs.testers }}; do args+=(--tester "$t"); done
          python3 tools/asc/testflight.py "${args[@]}"

      - name: Remove the key
        if: always()
        run: rm -rf .appstoreconnect
